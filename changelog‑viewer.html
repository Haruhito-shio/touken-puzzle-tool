<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新日志 | touken-puzzle-tool</title>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./components.css">
  <!-- 引入markdown渲染库，直接加载仓库内CHANGELOG.md -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* 精简页面样式，清爽留白，去掉多余组件 */
    body { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .header { display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;border-bottom:1px solid #ccc;padding-bottom:1rem; }
    #content { line-height:1.7; }
    /* 适配暗色主题，复用你的theme.css变量 */
  </style>
</head>
<body>
  <div class="header">
    <h1>更新日志</h1>
    <a href="./index.html">← 返回工具主页</a>
  </div>
  <div id="content"></div>

  <script>
    // 读取仓库内 CHANGELOG.md，渲染到页面
    fetch("./CHANGELOG.md")
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
  </script>
</body>
</html>
